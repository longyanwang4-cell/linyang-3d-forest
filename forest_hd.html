<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林样智记 V2.1 · FM1 高品质森林样板</title>
<script>
  if (!new URLSearchParams(location.search).has('legacy')) {
    window.location.replace('viewer.html' + location.search + location.hash);
  }
</script>
<style>
  :root {
    --primary-dark: #1e3d28;
    --bg-panel: rgba(245, 241, 232, 0.94);
    --text: #2b2b2b; --text-light: #6b6b6b; --border: #d8d2c4; --bad: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #canvas-container { position: absolute; inset: 0; }
  #canvas-container canvas { display: block; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(30,61,40,0.95), rgba(30,61,40,0.85));
    color: #f5f1e8; flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; font-weight: 600; }
  #topbar h1 small { font-weight: 400; opacity: 0.75; margin-left: 8px; font-size: 12px; }
  .btn-group { display: flex; gap: 5px; }
  .ctl-btn {
    padding: 5px 12px; border: 1px solid rgba(245,241,232,0.4); border-radius: 6px;
    background: rgba(245,241,232,0.08); color: #f5f1e8; font-size: 12.5px; cursor: pointer;
  }
  .ctl-btn:hover { background: rgba(245,241,232,0.22); }
  .ctl-btn.active { background: #f5f1e8; color: var(--primary-dark); font-weight: 600; }
  .spacer { flex: 1; }

  #search-box { position: absolute; top: 104px; right: 16px; z-index: 10; display: flex; gap: 6px; }
  #search-input {
    width: 150px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: var(--bg-panel); outline: none;
  }
  #btn-search { padding: 7px 12px; border: none; border-radius: 6px; background: #2d5a3d; color: #fff; cursor: pointer; }
  #search-msg { position: absolute; top: 140px; right: 16px; z-index: 10; color: var(--bad); font-size: 12px; background: var(--bg-panel); padding: 2px 6px; border-radius: 4px; }
  #search-msg:empty { display: none; }

  #stats {
    position: absolute; bottom: 44px; right: 16px; z-index: 9; padding: 6px 12px;
    border-radius: 6px; font-size: 12.5px; color: var(--text);
    background: var(--bg-panel); border: 1px solid var(--border);
  }
  #stats b { color: var(--primary-dark); }
  #fps {
    position: absolute; bottom: 12px; right: 16px; z-index: 9; padding: 4px 12px;
    border-radius: 6px; font-size: 12px; color: #f5f1e8;
    background: rgba(30,61,40,0.85); border: 1px solid #3a6b4f; min-width: 150px; text-align: center;
  }
  #coord-warning {
    position: absolute; bottom: 12px; left: 16px; right: 190px; z-index: 9;
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
    background: rgba(176, 125, 16, 0.92); color: #fff8e8; border: 1px solid #d9a52a;
  }
  #legend {
    position: absolute; bottom: 64px; left: 16px; z-index: 9;
    padding: 8px 12px; border-radius: 6px; font-size: 12px; color: var(--text);
    background: var(--bg-panel); border: 1px solid var(--border); line-height: 1.8;
  }
  .legend-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  #info-panel {
    position: absolute; top: 104px; right: 16px; width: 300px; max-height: calc(100% - 170px);
    overflow-y: auto; z-index: 11; display: none;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  }
  #info-panel.open { display: block; }
  .panel-close { position: absolute; top: 8px; right: 10px; border: none; background: transparent; font-size: 14px; cursor: pointer; color: var(--text-light); }
  .panel-close:hover { color: var(--bad); }
  .panel-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tag-badge { font-size: 17px; font-weight: 700; color: var(--primary-dark); background: #d4e4d0; padding: 2px 10px; border-radius: 6px; letter-spacing: 1px; }
  .species { font-size: 14px; font-weight: 600; }
  .seq { font-size: 12px; color: var(--text-light); }
  .info-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .info-table td { padding: 5px 4px; border-bottom: 1px solid #e8e4d8; }
  .info-table td:first-child { color: var(--text-light); white-space: nowrap; }
  .dim { color: var(--text-light); font-size: 11.5px; }
  .note { margin-top: 8px; padding: 7px 9px; border-radius: 6px; font-size: 12px; background: #fdf3e0; border: 1px solid #ecd9b0; color: #7a5a10; line-height: 1.5; }
  .note.ok { background: #e4f0e0; border-color: #bcd4b4; color: #2d5a3d; }
  .note.dim { background: #f2f0ea; border-color: var(--border); color: var(--text-light); }

  #loading {
    position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #22371f; color: #cfe0c8; font-size: 15px; transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(207,224,200,0.25); border-top-color: #cfe0c8; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="canvas-container"></div>

  <header id="topbar">
    <button class="ctl-btn" id="btn-back">← 返回</button>
    <h1>林样智记 V2.0<small>FM1 高品质森林样板 · 10 棵真实单木</small></h1>
    <div class="btn-group">
      <button class="tier-btn" data-tier="basic">基础</button>
      <button class="tier-btn active" data-tier="standard">标准</button>
      <button class="tier-btn" data-tier="cinema">电影</button>
    </div>
    <div class="btn-group">
      <button class="ctl-btn" id="btn-bird">鸟瞰</button>
      <button class="ctl-btn" id="btn-inside">林内</button>
      <button class="ctl-btn" id="btn-top">俯视</button>
      <button class="ctl-btn" id="btn-reset">重置</button>
    </div>
    <div class="btn-group">
      <button class="ctl-btn active" id="btn-science">科研层</button>
      <button class="ctl-btn active" id="btn-undergrowth">林下示意层</button>
    </div>
    <div class="spacer"></div>
  </header>

  <div id="search-box">
    <input id="search-input" placeholder="牌号或编号（如 0322）" autocomplete="off">
    <button id="btn-search">定位</button>
  </div>
  <span id="search-msg"></span>

  <div id="legend">
    <div><span class="legend-swatch" style="background:#c9a22e"></span>⭐ 高品质样板树 ×10（真实 DBH/H）</div>
    <div><span class="legend-swatch" style="background:#2f6134"></span>背景树 ×150（原版低成本·真实位置）</div>
    <div><span class="legend-swatch" style="background:#c23b22"></span>样地界桩（30m 网格示意）</div>
  </div>

  <div id="stats"></div>
  <div id="fps">FPS --</div>
  <div id="coord-warning">
    ⚠ 局部坐标未配准；季节色调与林下植被为示意层（无实测依据）；背景树保持原版模型，未新增任何实测外乔木。
  </div>

  <aside id="info-panel"></aside>
  <div id="loading"><div class="spinner"></div><div>正在加载高品质树木资产…</div></div>

  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script>
    window.__pageErrors = [];
    window.addEventListener('error', (e) => window.__pageErrors.push(String(e.message)));
    window.addEventListener('unhandledrejection', (e) => window.__pageErrors.push('P: ' + String(e.reason)));
  </script>
  <script type="module" src="./js/fm1_hd.js"></script>
</body>
</html>
